services:
  - type: web
    name: quarantine-server
    runtime: node
    rootDir: server
    buildCommand: yarn install --frozen-lockfile && yarn build
    startCommand: yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ABA_API_ID
        sync: false
      - key: ABA_API_HASH
        sync: false
      - key: ABA_SESSION
        sync: false
      - key: ABA_NOTIFICATION_CHAT_ID
        value: "-1003709094404"
      - key: ABA_PAYMENT_BOT_USERNAME
        value: "PayWayByABA_bot"
      - key: ABA_COPY_SENDER_ID
        value: "787981749"
      - key: ABA_ORDER_CHAT_ID
        value: "-1004370756195"
      - key: ABA_PAYMENT_HISTORY_CHAT_ID
        value: "-1004370756195"
      - key: ABA_ADMIN_CHAT_ID
        value: "787981749"
      - key: ABA_NAME_SIMILARITY_THRESHOLD
        value: "0.8"
      - key: ABA_MATCH_WINDOW_MINUTES
        value: "20"
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false